<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sketches — Minica Panchetti</title>

  <link rel="icon" type="image/png" href="gunkan.png">

  <meta name="description" content="Expérimentations graphiques de Minica Panchetti sur Feather3D ou au Grease Pencil de Blender.">
  <meta name="author" content="Minica Panchetti">
  <meta name="robots" content="index, follow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(circle at 18% 8%, rgba(170, 0, 80, 0.35), transparent 28%),
        radial-gradient(circle at 88% 88%, rgba(75, 45, 180, 0.42), transparent 30%),
        #020204;

      color: #f4f4f4;
      font-family: "Courier New", Courier, monospace;

      overflow-x: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;

      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

      background-size: 38px 38px;
    }

    main {
      position: relative;
      z-index: 1;

      padding: 120px 8vw 80px;
    }

    .back {
      position: absolute;
      top: 48px;
      left: 8vw;

      color: rgba(255,255,255,0.45);
      text-decoration: none;

      font-size: 0.9rem;
      letter-spacing: 0.08em;

      border-bottom: 1px solid rgba(255,255,255,0.18);
      padding-bottom: 4px;

      transition: 0.3s;
    }

    .back:hover {
      color: white;
      border-bottom-color: #ff2bbd;
    }

    h1 {
      margin: 0;

      font-size: clamp(2.2rem, 5vw, 4.5rem);
      font-weight: 400;

      letter-spacing: 0.24em;

      text-shadow: 0 0 18px rgba(255,255,255,0.18);
    }

    .subtitle {
      margin-top: 42px;
      max-width: 760px;

      font-size: clamp(0.95rem, 1.4vw, 1.1rem);
      line-height: 1.8;
      letter-spacing: 0.08em;

      color: rgba(255,255,255,0.74);
    }

    .gallery {
      margin-top: 100px;

      display: flex;
      flex-direction: column;

      gap: 120px;
    }

    .work {
      width: 100%;
    }

    .work-title {
      margin-bottom: 32px;

      font-size: 0.95rem;
      letter-spacing: 0.18em;

      text-transform: uppercase;

      color: rgba(255,255,255,0.48);
    }

    .embed-note {
      margin: 0 0 18px;

      color: rgba(255,255,255,0.82);

      font-size: 1rem;
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    .feather-embed {
      width: 88%;
      max-width: 900px;

      aspect-ratio: 1 / 1;

      margin: 0 auto;
      padding: 24px;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;

      overflow: hidden;

      background: rgba(255,255,255,0.03);

      backdrop-filter: blur(10px);
    }

    .feather-embed iframe {
      width: 100%;
      height: calc(100% - 62px);

      border: none;

      background: #000;
    }

    .video-embed {
      width: 88%;
      max-width: 900px;

      aspect-ratio: 1 / 1;

      margin: 0 auto;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;

      overflow: hidden;

      background: black;
    }

    .video-embed video {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      background: black;
    }

    .description {
      margin-top: 28px;
      max-width: 760px;

      line-height: 1.8;
      letter-spacing: 0.05em;

      color: rgba(255,255,255,0.65);
    }

    @media (max-width: 700px) {
      main {
        padding: 100px 24px 64px;
      }

      h1 {
        font-size: 2rem;
        letter-spacing: 0.12em;
      }

      .gallery {
        gap: 80px;
      }

      .feather-embed {
        width: 100%;
        padding: 18px;
      }

      .feather-embed iframe {
        height: calc(100% - 86px);
      }

      .video-embed {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="noise"></div>

  <main>

    <a class="back" href="recherche-creation.html">← Retour</a>

    <h1>Sketches</h1>

    <p class="subtitle">
      Esquisses 3D avec Feather3D ou le Grease Pencil de Blender.
    </p>

    <section class="gallery">

      <article class="work">

        <div class="work-title">
          Feather3D
        </div>
 <p class="embed-note">
            ⚠ Accepter les cookies
          </p>

        <div class="feather-embed">

         
          <iframe
            src="https://gallery.feather.art/works/hb6ul7t"
            title="Feather Sketch"
            loading="lazy"
            allowfullscreen>
          </iframe>

        </div>

        <p class="description">
          Stranger Things
        </p>

      </article>

      <article class="work">

        <div class="work-title">
          Grease Pencil — Blender
        </div>

        <div class="video-embed">

          <video autoplay muted loop playsinline controls>
            <source src="./assets/Sketches/pumpkin.mp4" type="video/mp4">
          </video>

        </div>

        <p class="description">
          Animation réalisée avec le Grease Pencil de Blender.
        </p>

      </article>

    </section>

  </main>

</body>

</html>
