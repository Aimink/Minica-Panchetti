  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 0, 140, 0.18), transparent 35%),
        radial-gradient(circle at 75% 65%, rgba(120, 80, 255, 0.18), transparent 35%),
        #05050a;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: min(90%, 900px);
      text-align: center;
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(18px);
      box-shadow: 0 0 80px rgba(255, 0, 140, 0.12);
    }

    .tag {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ff7bd5;
      letter-spacing: 0.12em;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
h1 {
  margin: 0;
  font-size: clamp(1.8rem, 4vw, 3.4rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  text-transform: none;
}

    h1 span {
      color: #ff4fc3;
      text-shadow: 0 0 28px rgba(255, 79, 195, 0.45);
    }

    p {
      margin: 28px auto 0;
      max-width: 560px;
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.6;
    }

    .links {
      margin-top: 34px;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      color: white;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      transition: 0.25s ease;
    }

    a:hover {
      background: #ff4fc3;
      border-color: #ff4fc3;
      box-shadow: 0 0 30px rgba(255, 79, 195, 0.45);
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;
      background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle, black, transparent 72%);
    }
  </style>
</head>

<body>
  <div class="grain"></div>

<main class="page">


  <h1>Minica <span>Panchetti</span></h1>

  <p>
    Enseignement & recherche-création en 3D, multimédia et dispositifs interactifs
  </p>

  <div class="links">
    <a href="https://vrun.minica-panchetti.fr">VRun</a>

  </div>
</main>
