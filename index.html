<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="google-site-verification" content="7241gU8jHsSpojf1q_EXKFzFz0maUcojdft3j5THsgc" />

  <title>Minica Panchetti</title>

  <meta name="description" content="Site de Minica Panchetti : créations interactives, 3D, recherche-création, projets immersifs et dispositifs numériques.">
  <meta name="author" content="Minica Panchetti">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://minica-panchetti.fr/">

  <meta property="og:title" content="Minica Panchetti">
  <meta property="og:description" content="Créations interactives, 3D, recherche-création et projets immersifs.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://minica-panchetti.fr/">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 0, 140, 0.18), transparent 35%),
        radial-gradient(circle at 75% 65%, rgba(120, 80, 255, 0.18), transparent 35%),
        #05050a;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: min(90%, 800px);
      text-align: center;
      padding: 40px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 500;
    }

    h1 span {
      color: #ff4fc3;
      text-shadow: 0 0 18px rgba(255, 79, 195, 0.5);
    }

    p {
      margin: 20px auto 0;
      max-width: 500px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .links {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 0.9rem;
      transition: 0.25s;
    }

    a:hover {
      background: #ff4fc3;
      border-color: #ff4fc3;
      box-shadow: 0 0 20px rgba(255, 79, 195, 0.5);
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image: linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>

<body>

<div class="grain"></div>

<main class="page">

  <h1>Minica <span>Panchetti</span></h1>

  <p>
    Enseignement & recherche-création en 3D, multimédia et dispositifs interactifs
  </p>

  <div class="links">
    <a href="https://vrun.minica-panchetti.fr">VRun</a>
    <a href="https://minicapanchetti.itch.io">itch.io</a>
  </div>

</main>

</body>
</html>
