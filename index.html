<head>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 8%, rgba(170, 0, 80, 0.35), transparent 28%),
        radial-gradient(circle at 88% 88%, rgba(75, 45, 180, 0.42), transparent 30%),
        #020204;
      color: #f4f4f4;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 38px 38px;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .content {
      transform: translateY(4vh);
      animation: appear 1.4s ease forwards;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.6rem);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-shadow: 0 0 18px rgba(255,255,255,0.18);
    }

    .statement {
      margin: 34px auto 0;
      max-width: 720px;
      font-size: clamp(0.95rem, 1.5vw, 1.2rem);
      line-height: 1.6;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.82);
    }

    .status {
      margin: 54px 0 0;
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.32);
    }

    .links {
      margin-top: 52px;
      display: flex;
      justify-content: center;
      gap: 76px;
      flex-wrap: wrap;
    }

    .links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.05rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 8px;
    }

    .links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #ff2bbd, #6d5cff);
      transform: scaleX(1);
      transform-origin: left;
    }

    .links a:hover::after {
      animation: underline 0.45s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(7vh);
      }
      to {
        opacity: 1;
        transform: translateY(4vh);
      }
    }

    @keyframes underline {
      0% { transform: scaleX(1); }
      50% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    @media (max-width: 700px) {
      h1 {
        letter-spacing: 0.14em;
        font-size: 2rem;
      }

      .statement {
        font-size: 0.95rem;
      }

      .links {
        gap: 28px;
      }
    }
    .statement a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.3);
}

.statement a:hover {
  border-bottom: 1px solid #ff2bbd;
}
  </style>
</head>

<body>
  <div class="noise"></div>

  <main>
    <section class="content">
      <h1>Minica Panchetti</h1>
<p class="statement">
  <a href="https://www.uttop.fr" target="_blank">Enseignement</a>, recherche-création<br>
  3D & dispositifs immersifs
</p>
      <p class="statement">
        Enseignement, Recherche-création
      </p>

       <p class="statement">
        3D & dispositifs immersifs
      </p>

      <p class="status"></p>

      <div class="links">
        <a href="https://vrun.minica-panchetti.fr">VRUN</a>
        <a href="https://minicapanchetti.itch.io">ITCH.IO</a>
      </div>
    </section>
  </main>
</body>
</html>
