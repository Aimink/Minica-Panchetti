<style>
.back {
  position: absolute;
  top: 48px;
  left: 8vw;

  color: rgba(255,255,255,0.45);

  text-decoration: none;

  font-size: 0.9rem;
  letter-spacing: 0.08em;

  border-bottom: 1px solid rgba(255,255,255,0.18);

  padding-bottom: 4px;

  transition: 0.3s;
}
.back:hover {
  color: white;
  border-bottom-color: #ff2bbd;
}
  * {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 18% 8%, rgba(170, 0, 80, 0.35), transparent 28%),
    radial-gradient(circle at 88% 88%, rgba(75, 45, 180, 0.42), transparent 30%),
    #020204;
  color: #f4f4f4;
  font-family: "Courier New", Courier, monospace;
  overflow: hidden;
}

.noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.08;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 38px 38px;
}

main {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  text-align: left;
  padding: 24px 8vw;
  position: relative;
  z-index: 1;
}

.content {
  max-width: 760px;
  animation: appear 1.4s ease forwards;
}

h1 {
  margin: 0;
  font-size: clamp(2.1rem, 4.2vw, 4.2rem);
  font-weight: 400;
  letter-spacing: 0.26em;
  text-shadow: 0 0 18px rgba(255,255,255,0.18);
}

.subtitle {
  margin: 42px 0 0;
  font-size: clamp(0.95rem, 1.4vw, 1.15rem);
  line-height: 1.6;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.78);
}

.statement {
  margin: 36px 0 0;
  font-size: clamp(0.95rem, 1.4vw, 1.15rem);
  line-height: 1.6;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.82);
}

.statement a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.35);
  padding-bottom: 3px;
}

.statement a:hover {
  border-bottom-color: #ff2bbd;
}

.status {
  margin: 42px 0 0;
  font-size: 0.95rem;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.32);
}

.links {
  margin-top: 64px;
  display: flex;
  justify-content: flex-start;
  gap: 54px;
  flex-wrap: wrap;
}

.links a {
  color: #ffffff;
  text-decoration: none;
  font-size: 1.05rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  position: relative;
  padding-bottom: 8px;
}

.links a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, #ff2bbd, #6d5cff);
}

.links a:hover::after {
  animation: underline 0.45s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(5vh);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes underline {
  0% { transform: scaleX(1); }
  50% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}

@media (max-width: 700px) {
  main {
    padding: 24px;
    align-items: center;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 0.12em;
  }

  .links {
    gap: 28px;
  }
}
  </style>
</head>

<body>
  <div class="noise"></div>

  <main>
    <a class="back" href="index.html">← Accueil</a>
    <section class="content">
      <h1>Recherche-création</h1>

           <p class="statement">
        3D & dispositifs immersifs
      </p>
      
<p class="statement">
 
</p>
      <p class="status"></p>

      <div class="links">
        <a href="https://vrun.minica-panchetti.fr">VRUN</a>
            </div>
    </section>
  </main>
</body>
</html>
